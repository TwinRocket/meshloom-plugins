# Catalogue validation (MSHL-200). Runs on every pull request, from forks too.
#
# Safety rules, asserted by tests/test_workflow_policy.py:
# - the `pull_request` trigger only (never its target-context variant), no repository
#   secret referenced anywhere, a read-only token;
# - GitHub-hosted runners only: `vars.RUNNER` may pick another GitHub-hosted label, and
#   both a preflight job and a first step in every job fail closed on anything else;
# - plugin archives are downloaded and extracted in fresh temp dirs and only ever run
#   inside bubblewrap (scripts/validate_catalogue.py);
# - the validator and its schemas run from the base commit, so this workflow does not judge a
#   pull request with rules that pull request edits (except the bootstrap, when the base
#   has none). That is not a protection on its own: a pull request that edits the rules is
#   reviewed by the code owners like any change, and an entry pull request that touches
#   anything else is refused by the validator and must be rejected;
# - entries are compared at the merge base of the base and head commits, so a branch that
#   is behind main is judged on its own changes only.
#
# The owner setting "Require approval for first-time contributors" (Settings > Actions)
# gates the first run of a newcomer's pull request; see AGENTS.md.
name: validate

on:
  pull_request:

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The meshloom commit whose plugin contract and `dev check` the catalogue follows.
  # Pinned on preversion-5; switch to the 5.0.0 tag's commit at release. The single
  # source: tests/test_schema_contract.py reads it from here.
  MESHLOOM_REF: e2bf78a186ebff13eb66bb7dcacf3e83805d0235
  MESHLOOM_REPO: TwinRocket/meshloom

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Refuse anything but GitHub-hosted runners
        env:
          RUNNER_LABEL: ${{ vars.RUNNER }}
        run: |
          if [ -n "$RUNNER_LABEL" ] && ! printf '%s' "$RUNNER_LABEL" | grep -Eqx 'ubuntu-latest|ubuntu-2[2-9]\.04(-arm)?'; then
            echo "::error::vars.RUNNER must be empty or a GitHub-hosted Ubuntu label; self-hosted runners never run catalogue pull requests"
            exit 1
          fi

  tests:
    name: tests
    needs: preflight
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Refuse self-hosted runners
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::this workflow only runs on GitHub-hosted runners"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MESHLOOM_REPO }}
          ref: ${{ env.MESHLOOM_REF }}
          path: .meshloom
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Set up the pinned meshloom
        working-directory: .meshloom
        env:
          UV_PYTHON: "3.13"
        run: uv sync --frozen --no-dev
      - name: Lint
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check
      - name: Tests
        env:
          MESHLOOM_DIR: .meshloom
          CATALOGUE_STRICT: "1"
        run: uv run --frozen pytest -q

  validate:
    name: validate (${{ matrix.python }})
    needs: preflight
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - name: Refuse self-hosted runners
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::this workflow only runs on GitHub-hosted runners"
            exit 1
          fi
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base (the validator and its schemas)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MESHLOOM_REPO }}
          ref: ${{ env.MESHLOOM_REF }}
          path: .meshloom
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Set up the pinned meshloom on Python ${{ matrix.python }}
        working-directory: .meshloom
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv sync --frozen --no-dev
      - name: Validate the changed entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          tools=base
          if [ ! -f base/scripts/validate_catalogue.py ]; then
            echo "::notice::the base has no validator yet (bootstrap): using the pull request's"
            tools=pr
          fi
          summary=/dev/null
          if [ "$PYTHON_VERSION" = "3.13" ]; then summary="$GITHUB_STEP_SUMMARY"; fi
          work="$(mktemp -d "$RUNNER_TEMP/catalogue-XXXXXX")"
          uv run --frozen --project "$tools" python "$tools/scripts/validate_catalogue.py" \
            --repo pr --base "$BASE_SHA" --head "$HEAD_SHA" \
            --meshloom .meshloom --work "$work" --summary "$summary"

  result:
    name: result
    needs: [preflight, tests, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a validation job did not succeed ($r)"
              exit 1
            fi
          done
